<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0A" />
      <stop offset="100%" stop-color="#101412" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2422" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="60" y="80" fill="#F4F5F2" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">RAG Architecture</text>
  <text x="60" y="110" fill="#B7FF3C" font-family="monospace" font-size="14">RETRIEVAL-AUGMENTED GENERATION WORKFLOW</text>

  <!-- 4 Step Pipeline -->
  <!-- Step 1: Chunking -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="240" height="260" rx="12" fill="#111514" stroke="#1E2422" stroke-width="1.5" />
    <text x="25" y="40" fill="#B7FF3C" font-family="monospace" font-size="13">01. INGESTION</text>
    <text x="25" y="65" fill="#F4F5F2" font-family="system-ui" font-size="18" font-weight="bold">Docs &amp; Chunking</text>
    <line x1="20" y1="85" x2="220" y2="85" stroke="#1E2422" />
    <rect x="25" y="105" width="190" height="30" rx="4" fill="#181C1A" />
    <text x="40" y="125" fill="#A3AAA5" font-family="monospace" font-size="11">PDFs, Markdown, DB</text>
    <rect x="25" y="145" width="190" height="30" rx="4" fill="#181C1A" />
    <text x="40" y="165" fill="#A3AAA5" font-family="monospace" font-size="11">Chunk: 500 tokens</text>
    <text x="25" y="210" fill="#6B736D" font-family="monospace" font-size="11">Sliding context window</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 310 330 L 340 330" stroke="#B7FF3C" stroke-width="2" />

  <!-- Step 2: Embedding & Vector DB -->
  <g transform="translate(350, 200)">
    <rect x="0" y="0" width="240" height="260" rx="12" fill="#111514" stroke="#B7FF3C" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="25" y="40" fill="#B7FF3C" font-family="monospace" font-size="13">02. EMBEDDINGS</text>
    <text x="25" y="65" fill="#F4F5F2" font-family="system-ui" font-size="18" font-weight="bold">Vector Database</text>
    <line x1="20" y1="85" x2="220" y2="85" stroke="#1E2422" />
    <rect x="25" y="105" width="190" height="45" rx="4" fill="#181C1A" />
    <text x="40" y="125" fill="#B7FF3C" font-family="monospace" font-size="11">Vector: [0.038, -0.12]</text>
    <text x="40" y="140" fill="#6B736D" font-family="monospace" font-size="10">1,536 Dimensions</text>
    <text x="25" y="180" fill="#A3AAA5" font-family="monospace" font-size="11">Cosine Similarity (HNSW)</text>
    <text x="25" y="205" fill="#6B736D" font-family="monospace" font-size="11">Top-K semantic match</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 600 330 L 630 330" stroke="#B7FF3C" stroke-width="2" />

  <!-- Step 3: Prompt Augmentation -->
  <g transform="translate(640, 200)">
    <rect x="0" y="0" width="240" height="260" rx="12" fill="#111514" stroke="#1E2422" stroke-width="1.5" />
    <text x="25" y="40" fill="#B7FF3C" font-family="monospace" font-size="13">03. AUGMENTATION</text>
    <text x="25" y="65" fill="#F4F5F2" font-family="system-ui" font-size="18" font-weight="bold">Context Inject</text>
    <line x1="20" y1="85" x2="220" y2="85" stroke="#1E2422" />
    <rect x="25" y="105" width="190" height="70" rx="4" fill="#181C1A" />
    <text x="35" y="125" fill="#EAB308" font-family="monospace" font-size="10">SYSTEM: Ground in context</text>
    <text x="35" y="145" fill="#A3AAA5" font-family="monospace" font-size="10">CONTEXT: [Retrieved chunk]</text>
    <text x="35" y="165" fill="#B7FF3C" font-family="monospace" font-size="10">USER: Specific Question</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 890 330 L 920 330" stroke="#B7FF3C" stroke-width="2" />

  <!-- Step 4: Grounded LLM Response -->
  <g transform="translate(930, 200)">
    <rect x="0" y="0" width="220" height="260" rx="12" fill="#181C1A" stroke="#22C55E" stroke-width="2" />
    <text x="25" y="40" fill="#22C55E" font-family="monospace" font-size="13">04. GENERATION</text>
    <text x="25" y="65" fill="#F4F5F2" font-family="system-ui" font-size="18" font-weight="bold">Accurate Output</text>
    <line x1="20" y1="85" x2="200" y2="85" stroke="#1E2422" />
    <circle cx="45" cy="115" r="8" fill="#22C55E" />
    <text x="65" y="120" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">ZERO Hallucination</text>
    <circle cx="45" cy="150" r="8" fill="#22C55E" />
    <text x="65" y="155" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">Direct Citations</text>
    <circle cx="45" cy="185" r="8" fill="#22C55E" />
    <text x="65" y="190" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">Private Data Safe</text>
  </g>
</svg>
