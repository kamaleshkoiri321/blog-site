<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0A" />
      <stop offset="50%" stop-color="#101412" />
      <stop offset="100%" stop-color="#080A0A" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B7FF3C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#B7FF3C" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2422" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="600" cy="315" r="350" fill="url(#glow)" />

  <!-- Neural Net Layer nodes & connections -->
  <g stroke="#B7FF3C" stroke-opacity="0.3" stroke-width="1.5">
    <!-- Links -->
    <line x1="280" y1="180" x2="480" y2="240" />
    <line x1="280" y1="180" x2="480" y2="380" />
    <line x1="280" y1="315" x2="480" y2="240" />
    <line x1="280" y1="315" x2="480" y2="315" />
    <line x1="280" y1="315" x2="480" y2="380" />
    <line x1="280" y1="450" x2="480" y2="240" />
    <line x1="280" y1="450" x2="480" y2="380" />

    <line x1="480" y1="240" x2="720" y2="220" />
    <line x1="480" y1="240" x2="720" y2="315" />
    <line x1="480" y1="315" x2="720" y2="315" />
    <line x1="480" y1="380" x2="720" y2="315" />
    <line x1="480" y1="380" x2="720" y2="410" />

    <line x1="720" y1="220" x2="920" y2="315" stroke="#B7FF3C" stroke-opacity="0.6" stroke-width="2" />
    <line x1="720" y1="315" x2="920" y2="315" stroke="#B7FF3C" stroke-opacity="0.8" stroke-width="2.5" />
    <line x1="720" y1="410" x2="920" y2="315" stroke="#B7FF3C" stroke-opacity="0.6" stroke-width="2" />
  </g>

  <!-- Input nodes -->
  <circle cx="280" cy="180" r="10" fill="#181C1A" stroke="#B7FF3C" stroke-width="2" />
  <circle cx="280" cy="315" r="10" fill="#181C1A" stroke="#B7FF3C" stroke-width="2" />
  <circle cx="280" cy="450" r="10" fill="#181C1A" stroke="#B7FF3C" stroke-width="2" />

  <!-- Hidden layer 1 -->
  <circle cx="480" cy="240" r="12" fill="#101412" stroke="#B7FF3C" stroke-width="2" />
  <circle cx="480" cy="315" r="12" fill="#101412" stroke="#B7FF3C" stroke-width="2" />
  <circle cx="480" cy="380" r="12" fill="#101412" stroke="#B7FF3C" stroke-width="2" />

  <!-- Hidden layer 2 -->
  <circle cx="720" cy="220" r="14" fill="#101412" stroke="#B7FF3C" stroke-width="2.5" />
  <circle cx="720" cy="315" r="18" fill="#101412" stroke="#B7FF3C" stroke-width="3" />
  <circle cx="720" cy="410" r="14" fill="#101412" stroke="#B7FF3C" stroke-width="2.5" />

  <!-- Target predicted token node -->
  <circle cx="920" cy="315" r="28" fill="#B7FF3C" />
  <circle cx="920" cy="315" r="42" fill="none" stroke="#B7FF3C" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Text badges -->
  <rect x="220" y="520" width="120" height="32" rx="6" fill="#181C1A" stroke="#1E2422" />
  <text x="280" y="541" fill="#A3AAA5" font-family="monospace" font-size="13" text-anchor="middle">Input Tokens</text>

  <rect x="420" y="520" width="120" height="32" rx="6" fill="#181C1A" stroke="#1E2422" />
  <text x="480" y="541" fill="#A3AAA5" font-family="monospace" font-size="13" text-anchor="middle">Attention QKV</text>

  <rect x="660" y="520" width="120" height="32" rx="6" fill="#181C1A" stroke="#1E2422" />
  <text x="720" y="541" fill="#A3AAA5" font-family="monospace" font-size="13" text-anchor="middle">Transformer</text>

  <rect x="850" y="520" width="140" height="32" rx="6" fill="#181C1A" stroke="#B7FF3C" stroke-opacity="0.4" />
  <text x="920" y="541" fill="#B7FF3C" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Next Token [P]</text>

  <!-- Title watermark -->
  <text x="60" y="80" fill="#F4F5F2" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">ChatGPT Inference Pipeline</text>
  <text x="60" y="110" fill="#B7FF3C" font-family="monospace" font-size="14">AUTOREGRESSIVE TOKEN GENERATION</text>
</svg>
