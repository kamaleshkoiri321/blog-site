<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0A" />
      <stop offset="100%" stop-color="#101412" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2422" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="60" y="80" fill="#F4F5F2" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Developer Toolset &amp; Utilities</text>
  <text x="60" y="110" fill="#B7FF3C" font-family="monospace" font-size="14">HIGH-LEVERAGE WEB PLATFORMS</text>

  <!-- 3 browser window cards -->
  <g transform="translate(100, 160)">
    <!-- Window 1: Regex101 -->
    <rect x="0" y="0" width="300" height="360" rx="12" fill="#111514" stroke="#1E2422" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" opacity="0.6" />
    <circle cx="36" cy="20" r="5" fill="#EAB308" opacity="0.6" />
    <circle cx="52" cy="20" r="5" fill="#22C55E" opacity="0.6" />
    <text x="75" y="24" fill="#A3AAA5" font-family="monospace" font-size="12">regex101.com</text>
    <line x1="0" y1="40" x2="300" y2="40" stroke="#1E2422" />
    <rect x="20" y="60" width="260" height="36" rx="6" fill="#181C1A" stroke="#B7FF3C" stroke-opacity="0.3" />
    <text x="35" y="83" fill="#B7FF3C" font-family="monospace" font-size="13">^([a-z0-9_\.-]+)</text>
    <text x="20" y="130" fill="#6B736D" font-family="monospace" font-size="11">// Match 1: Full Match</text>
    <text x="20" y="155" fill="#A3AAA5" font-family="monospace" font-size="11">Group 1: thelazyengineer</text>
  </g>

  <g transform="translate(450, 160)">
    <!-- Window 2: DevDocs -->
    <rect x="0" y="0" width="300" height="360" rx="12" fill="#111514" stroke="#B7FF3C" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" opacity="0.6" />
    <circle cx="36" cy="20" r="5" fill="#EAB308" opacity="0.6" />
    <circle cx="52" cy="20" r="5" fill="#22C55E" opacity="0.6" />
    <text x="75" y="24" fill="#A3AAA5" font-family="monospace" font-size="12">bundlephobia.com</text>
    <line x1="0" y1="40" x2="300" y2="40" stroke="#1E2422" />
    <rect x="20" y="60" width="260" height="90" rx="8" fill="#181C1A" />
    <text x="35" y="95" fill="#F4F5F2" font-family="monospace" font-size="18" font-weight="bold">1.4 kB</text>
    <text x="35" y="120" fill="#A3AAA5" font-family="monospace" font-size="12">MINIFIED + GZIPPED</text>
    <circle cx="230" cy="105" r="24" fill="none" stroke="#B7FF3C" stroke-width="4" />
  </g>

  <g transform="translate(800, 160)">
    <!-- Window 3: JSON Crack -->
    <rect x="0" y="0" width="300" height="360" rx="12" fill="#111514" stroke="#1E2422" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" opacity="0.6" />
    <circle cx="36" cy="20" r="5" fill="#EAB308" opacity="0.6" />
    <circle cx="52" cy="20" r="5" fill="#22C55E" opacity="0.6" />
    <text x="75" y="24" fill="#A3AAA5" font-family="monospace" font-size="12">jsoncrack.com</text>
    <line x1="0" y1="40" x2="300" y2="40" stroke="#1E2422" />
    <!-- Graph nodes -->
    <rect x="30" y="80" width="80" height="35" rx="4" fill="#181C1A" stroke="#B7FF3C" />
    <rect x="180" y="60" width="90" height="35" rx="4" fill="#181C1A" stroke="#1E2422" />
    <rect x="180" y="110" width="90" height="35" rx="4" fill="#181C1A" stroke="#1E2422" />
    <path d="M 110 97 L 180 77" stroke="#B7FF3C" stroke-opacity="0.5" />
    <path d="M 110 97 L 180 127" stroke="#B7FF3C" stroke-opacity="0.5" />
  </g>
</svg>
