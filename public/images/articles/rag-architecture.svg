<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0A" />
      <stop offset="100%" stop-color="#121715" />
    </linearGradient>
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1A211E" stroke-width="0.75" />
    </pattern>
    <marker id="neonArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B7FF3C" />
    </marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#archBg)" />
  <rect width="1200" height="560" fill="url(#archGrid)" />

  <!-- Diagram Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#F4F5F2" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700">System Architecture</text>
    <text x="0" y="24" fill="#8E9992" font-family="'JetBrains Mono', monospace" font-size="13">Local execution sandbox with zero server dependencies &amp; a single outbound LLM call</text>
  </g>

  <!-- ============================================== -->
  <!-- LEFT ZONE: LOCAL ENVIRONMENT (rag-chatbot/)   -->
  <!-- ============================================== -->
  <g transform="translate(60, 95)">
    <!-- Container -->
    <rect x="0" y="0" width="680" height="425" rx="16" fill="#0D1210" stroke="#1F2A25" stroke-width="1.5" />
    
    <!-- Environment Header -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="220" height="26" rx="6" fill="#16221A" stroke="#2B4433" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#B7FF3C" />
      <text x="26" y="17" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LOCAL MACHINE (Your Laptop)</text>
      <text x="240" y="18" fill="#5E6C64" font-family="'JetBrains Mono', monospace" font-size="12">~/rag-chatbot/</text>
    </g>

    <!-- Sub-Box 1: Source Documents -->
    <g transform="translate(24, 65)">
      <rect x="0" y="0" width="180" height="150" rx="10" fill="#141B18" stroke="#25322C" stroke-width="1" />
      <text x="16" y="26" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="11">LOCAL FILES</text>
      <text x="16" y="48" fill="#F4F5F2" font-family="'Inter', sans-serif" font-size="15" font-weight="600">docs/ folder</text>
      <rect x="16" y="62" width="148" height="28" rx="4" fill="#1B2320" />
      <text x="26" y="80" fill="#A3AAA5" font-family="'JetBrains Mono', monospace" font-size="11">📄 handbook.md</text>
      <rect x="16" y="98" width="148" height="28" rx="4" fill="#1B2320" />
      <text x="26" y="116" fill="#A3AAA5" font-family="'JetBrains Mono', monospace" font-size="11">📄 faq.txt</text>
    </g>

    <!-- Sub-Box 2: Ingestion Script -->
    <g transform="translate(230, 65)">
      <rect x="0" y="0" width="190" height="150" rx="10" fill="#141B18" stroke="#25322C" stroke-width="1" />
      <text x="16" y="26" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="11">SCRIPT 1</text>
      <text x="16" y="48" fill="#F4F5F2" font-family="'Inter', sans-serif" font-size="15" font-weight="600">ingest.py</text>
      <text x="16" y="72" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">• Reads all docs</text>
      <text x="16" y="92" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">• Chunks: 800c / 150o</text>
      <text x="16" y="112" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">• Generates embeddings</text>
      <text x="16" y="132" fill="#4EFA8F" font-family="'JetBrains Mono', monospace" font-size="10">upsert() to collection</text>
    </g>

    <!-- Connector: docs -> ingest.py -->
    <line x1="205" y1="140" x2="225" y2="140" stroke="#B7FF3C" stroke-width="2" marker-end="url(#neonArrow)" />

    <!-- Sub-Box 3: ChromaDB Vector Store -->
    <g transform="translate(445, 65)">
      <rect x="0" y="0" width="210" height="335" rx="12" fill="#16221A" stroke="#B7FF3C" stroke-width="1.5" />
      <rect x="16" y="18" width="115" height="22" rx="4" fill="#1E3224" />
      <text x="24" y="33" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">EMBEDDING DB</text>
      
      <text x="16" y="65" fill="#F4F5F2" font-family="'Inter', sans-serif" font-size="18" font-weight="700">ChromaDB</text>
      <text x="16" y="85" fill="#8E9992" font-family="'JetBrains Mono', monospace" font-size="11">path="db" (Persistent)</text>
      <line x1="16" y1="102" x2="194" y2="102" stroke="#283C2F" />

      <text x="16" y="125" fill="#E1E6E2" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Storage Structure:</text>
      <rect x="16" y="135" width="178" height="42" rx="6" fill="#111B15" />
      <text x="24" y="152" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="10">ids: ["handbook-0", ...]</text>
      <text x="24" y="167" fill="#8E9992" font-family="'JetBrains Mono', monospace" font-size="10">meta: {"source": "..."}</text>

      <rect x="16" y="188" width="178" height="70" rx="6" fill="#111B15" />
      <text x="24" y="208" fill="#E1E6E2" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Search Interface:</text>
      <text x="24" y="226" fill="#4EFA8F" font-family="'JetBrains Mono', monospace" font-size="10">query_texts=[query]</text>
      <text x="24" y="244" fill="#A3AAA5" font-family="'JetBrains Mono', monospace" font-size="10">n_results=4</text>

      <rect x="16" y="272" width="178" height="46" rx="6" fill="#192A1F" stroke="#2F4C36" stroke-width="1" />
      <text x="24" y="292" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="10">🔒 100% PRIVATE &amp; LOCAL</text>
      <text x="24" y="306" fill="#8E9992" font-family="'Inter', sans-serif" font-size="10">Zero raw docs sent outside</text>
    </g>

    <!-- Connector: ingest.py -> ChromaDB -->
    <line x1="420" y1="140" x2="440" y2="140" stroke="#B7FF3C" stroke-width="2" marker-end="url(#neonArrow)" />

    <!-- Sub-Box 4: Chatbot Script (Interactive CLI) -->
    <g transform="translate(24, 235)">
      <rect x="0" y="0" width="395" height="165" rx="10" fill="#141B18" stroke="#25322C" stroke-width="1" />
      <text x="16" y="26" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">SCRIPT 2</text>
      <text x="16" y="48" fill="#F4F5F2" font-family="'Inter', sans-serif" font-size="16" font-weight="600">chat.py (Interactive CLI)</text>
      
      <!-- Interactive Flow -->
      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="363" height="42" rx="6" fill="#1B2320" />
        <text x="12" y="18" fill="#8E9992" font-family="'JetBrains Mono', monospace" font-size="10">1. Reads CLI input: question = input("You: ")</text>
        <text x="12" y="32" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="10">2. Calls collection.query() → Top 4 chunks</text>
      </g>

      <g transform="translate(16, 112)">
        <rect x="0" y="0" width="363" height="40" rx="6" fill="#1B2320" />
        <text x="12" y="16" fill="#EAB308" font-family="'JetBrains Mono', monospace" font-size="10">3. Formats prompt with strict boundary instructions</text>
        <text x="12" y="30" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">4. Dispatches single message call to Claude</text>
      </g>
    </g>

    <!-- Bidirectional Connector between chat.py and ChromaDB -->
    <line x1="420" y1="300" x2="440" y2="300" stroke="#B7FF3C" stroke-width="2" marker-end="url(#neonArrow)" />
  </g>

  <!-- ============================================== -->
  <!-- RIGHT ZONE: CLOUD API (Anthropic Claude)      -->
  <!-- ============================================== -->
  <g transform="translate(780, 95)">
    <!-- Container -->
    <rect x="0" y="0" width="360" height="425" rx="16" fill="#0D1210" stroke="#232C38" stroke-width="1.5" />
    
    <!-- Environment Header -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#15202B" stroke="#253E54" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38BDF8" />
      <text x="26" y="17" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CLOUD API (Outbound)</text>
    </g>

    <text x="24" y="85" fill="#F4F5F2" font-family="'Inter', sans-serif" font-size="20" font-weight="700">Anthropic Claude</text>
    <text x="24" y="108" fill="#8E9992" font-family="'JetBrains Mono', monospace" font-size="12">model="claude-3-5-sonnet"</text>

    <!-- API Payload Details Box -->
    <g transform="translate(24, 130)">
      <rect x="0" y="0" width="312" height="155" rx="10" fill="#141B20" stroke="#233544" stroke-width="1" />
      <text x="16" y="26" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">WHAT GETS TRANSMITTED?</text>
      
      <text x="16" y="52" fill="#E1E6E2" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Request Payload:</text>
      <text x="16" y="72" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">• Strict guardrail instructions</text>
      <text x="16" y="90" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">• 4 retrieved text snippets (~3.2k chars)</text>
      <text x="16" y="108" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">• The single user question</text>
      <text x="16" y="132" fill="#4EFA8F" font-family="'JetBrains Mono', monospace" font-size="10">✓ Never your whole file system</text>
    </g>

    <!-- Response Box -->
    <g transform="translate(24, 300)">
      <rect x="0" y="0" width="312" height="100" rx="10" fill="#15241C" stroke="#2E5037" stroke-width="1" />
      <text x="16" y="26" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="11">INBOUND RESPONSE</text>
      <text x="16" y="50" fill="#F4F5F2" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Fact-grounded synthesis</text>
      <text x="16" y="70" fill="#8E9992" font-family="'Inter', sans-serif" font-size="11">Direct answer or "I don't know" guarantee</text>
      <text x="16" y="88" fill="#4EFA8F" font-family="'JetBrains Mono', monospace" font-size="10">latency: ~400ms · max_tokens: 500</text>
    </g>
  </g>

  <!-- Bridges between Local chat.py and Cloud Claude -->
  <!-- Outbound Arrow (Prompt) -->
  <g transform="translate(425, 360)">
    <path d="M 0 0 L 350 0" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#cyanArrow)" stroke-dasharray="4 4" />
    <rect x="110" y="-18" width="135" height="20" rx="4" fill="#0D161F" />
    <text x="116" y="-4" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">Prompt with 4 Chunks</text>
  </g>

  <!-- Inbound Arrow (Answer) -->
  <g transform="translate(425, 395)">
    <path d="M 350 0 L 0 0" fill="none" stroke="#B7FF3C" stroke-width="2" marker-end="url(#neonArrow)" />
    <rect x="115" y="-14" width="125" height="20" rx="4" fill="#142218" />
    <text x="122" y="0" fill="#B7FF3C" font-family="'JetBrains Mono', monospace" font-size="10">Grounded Response</text>
  </g>
</svg>
