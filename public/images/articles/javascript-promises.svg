<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0A" />
      <stop offset="100%" stop-color="#101412" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2422" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="60" y="80" fill="#F4F5F2" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Asynchronous JavaScript Engine</text>
  <text x="60" y="110" fill="#B7FF3C" font-family="monospace" font-size="14">PROMISE STATES &amp; MICROTASK QUEUE</text>

  <!-- Flowchart: Pending -> Fulfilled / Rejected -->
  <!-- Pending Card -->
  <g transform="translate(150, 240)">
    <rect x="0" y="0" width="220" height="120" rx="12" fill="#111514" stroke="#EAB308" stroke-width="2" />
    <circle cx="35" cy="35" r="8" fill="#EAB308" />
    <text x="55" y="40" fill="#F4F5F2" font-family="monospace" font-size="16" font-weight="bold">PENDING</text>
    <text x="25" y="75" fill="#A3AAA5" font-family="monospace" font-size="12">Operation in flight...</text>
    <text x="25" y="95" fill="#6B736D" font-family="monospace" font-size="11">new Promise(...) </text>
  </g>

  <!-- Connectors -->
  <path d="M 370 280 L 520 200" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="5 5" />
  <path d="M 370 320 L 520 400" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5 5" />

  <!-- Fulfilled Card -->
  <g transform="translate(520, 140)">
    <rect x="0" y="0" width="240" height="120" rx="12" fill="#111514" stroke="#22C55E" stroke-width="2" />
    <circle cx="35" cy="35" r="8" fill="#22C55E" />
    <text x="55" y="40" fill="#22C55E" font-family="monospace" font-size="16" font-weight="bold">FULFILLED</text>
    <text x="25" y="75" fill="#F4F5F2" font-family="monospace" font-size="12">.then(value =&gt; { ... })</text>
    <text x="25" y="95" fill="#A3AAA5" font-family="monospace" font-size="11">resolve(result)</text>
  </g>

  <!-- Rejected Card -->
  <g transform="translate(520, 340)">
    <rect x="0" y="0" width="240" height="120" rx="12" fill="#111514" stroke="#EF4444" stroke-width="2" />
    <circle cx="35" cy="35" r="8" fill="#EF4444" />
    <text x="55" y="40" fill="#EF4444" font-family="monospace" font-size="16" font-weight="bold">REJECTED</text>
    <text x="25" y="75" fill="#F4F5F2" font-family="monospace" font-size="12">.catch(error =&gt; { ... })</text>
    <text x="25" y="95" fill="#A3AAA5" font-family="monospace" font-size="11">reject(err)</text>
  </g>

  <!-- Async/await box on the right -->
  <g transform="translate(850, 190)">
    <rect x="0" y="0" width="260" height="220" rx="12" fill="#181C1A" stroke="#B7FF3C" stroke-width="1.5" />
    <text x="25" y="35" fill="#B7FF3C" font-family="monospace" font-size="14" font-weight="bold">Modern Syntax</text>
    <line x1="20" y1="48" x2="240" y2="48" stroke="#1E2422" />
    <text x="25" y="80" fill="#A3AAA5" font-family="monospace" font-size="12">try {</text>
    <text x="40" y="105" fill="#F4F5F2" font-family="monospace" font-size="12">const data =</text>
    <text x="55" y="130" fill="#B7FF3C" font-family="monospace" font-size="12">await promise;</text>
    <text x="25" y="155" fill="#A3AAA5" font-family="monospace" font-size="12">} catch (err) {</text>
    <text x="40" y="180" fill="#EF4444" font-family="monospace" font-size="12">handle(err);</text>
    <text x="25" y="200" fill="#A3AAA5" font-family="monospace" font-size="12">}</text>
  </g>
</svg>
