<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0A" />
      <stop offset="100%" stop-color="#101412" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2422" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <text x="60" y="80" fill="#F4F5F2" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">REST API Architecture</text>
  <text x="60" y="110" fill="#B7FF3C" font-family="monospace" font-size="14">CLIENT-SERVER HTTP REQUEST &amp; RESPONSE CONTRACT</text>

  <!-- Client Box -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="260" height="260" rx="16" fill="#111514" stroke="#1E2422" stroke-width="2" />
    <text x="30" y="45" fill="#F4F5F2" font-family="monospace" font-size="16" font-weight="bold">Client Application</text>
    <line x1="20" y1="65" x2="240" y2="65" stroke="#1E2422" />
    <text x="30" y="100" fill="#A3AAA5" font-family="monospace" font-size="13">Browser / Mobile App</text>
    <rect x="30" y="130" width="200" height="35" rx="6" fill="#181C1A" />
    <text x="45" y="153" fill="#B7FF3C" font-family="monospace" font-size="12">fetch('/api/users')</text>
    <rect x="30" y="180" width="80" height="24" rx="4" fill="#B7FF3C" />
    <text x="45" y="197" fill="#080A0A" font-family="monospace" font-size="11" font-weight="bold">GET / POST</text>
  </g>

  <!-- Connecting arrows with HTTP requests -->
  <g transform="translate(380, 230)">
    <!-- Request arrow -->
    <path d="M 0 40 L 400 40" stroke="#B7FF3C" stroke-width="3" />
    <polygon points="400,40 385,32 385,48" fill="#B7FF3C" />
    <rect x="120" y="15" width="160" height="26" rx="4" fill="#080A0A" stroke="#B7FF3C" stroke-width="1" />
    <text x="200" y="32" fill="#B7FF3C" font-family="monospace" font-size="11" text-anchor="middle">HTTP Request + Headers</text>

    <!-- Response arrow -->
    <path d="M 400 130 L 0 130" stroke="#A3AAA5" stroke-width="3" stroke-dasharray="6 6" />
    <polygon points="0,130 15,122 15,138" fill="#A3AAA5" />
    <rect x="120" y="140" width="160" height="26" rx="4" fill="#080A0A" stroke="#1E2422" />
    <text x="200" y="157" fill="#22C55E" font-family="monospace" font-size="11" text-anchor="middle">200 OK + JSON Body</text>
  </g>

  <!-- Server Box -->
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="260" height="260" rx="16" fill="#111514" stroke="#B7FF3C" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="30" y="45" fill="#F4F5F2" font-family="monospace" font-size="16" font-weight="bold">Backend Server</text>
    <line x1="20" y1="65" x2="240" y2="65" stroke="#1E2422" />
    <text x="30" y="100" fill="#A3AAA5" font-family="monospace" font-size="13">Routing &amp; Controller</text>
    <text x="30" y="130" fill="#6B736D" font-family="monospace" font-size="11">Database Query: SQL</text>
    <rect x="30" y="155" width="200" height="70" rx="6" fill="#181C1A" />
    <text x="40" y="180" fill="#A3AAA5" font-family="monospace" font-size="11">{ "status": "success",</text>
    <text x="50" y="202" fill="#B7FF3C" font-family="monospace" font-size="11">"data": [...] }</text>
  </g>
</svg>
